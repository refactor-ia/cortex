name: Bug report
description: Report a concrete defect for an approved issue.
title: "Bug: "
labels:
  - type:bug
body:
  - type: markdown
    attributes:
      value: Describe the problem, intended outcome, scope, acceptance criteria, and evidence.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and where can it be observed?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: What observable behavior should occur instead?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Affected scope
      description: Identify the affected component, version, environment, or boundary.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State the concrete conditions that demonstrate the defect is resolved.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Provide reproduction details, logs, screenshots, or other supporting evidence.
    validations:
      required: true
